<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera + Strip Analyzer</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #loading { margin-bottom: 1rem; font-size: 1.1rem; }
    #takePicBtn { padding: .8rem 1.2rem; font-size: 1rem; }
    #canvasContainer { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
    canvas { border: 1px solid #ccc; max-width: 45vw; height: auto; }
    #output { margin-top: 1.5rem; }
    .result { margin: .4rem 0; }
  </style>

  <!-- Define Module BEFORE loading OpenCV.js -->
  <script>
    var Module = {
      onRuntimeInitialized: function() {
        document.getElementById('loading').textContent = '✅ OpenCV.js loaded.';
        document.getElementById('takePicBtn').disabled = false;
      }
    };
  </script>

  <!-- Load OpenCV.js -->
  <script src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body>

  <h1>Camera + Test-Strip Analyzer</h1>
  <div id="loading">Loading OpenCV.js…</div>

  <!-- Button triggers hidden file input -->
  <button id="takePicBtn" disabled>Take Picture</button>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

  <!-- Canvases for raw & warped images -->
  <div id="canvasContainer">
    <canvas id="canvasOutput"></canvas>
    <canvas id="canvasWarped"></canvas>
  </div>

  <!-- Results display -->
  <div id="output">
    <div class="result">Glucose:   <strong id="res-glucose">—</strong></div>
    <div class="result">Protein:   <strong id="res-protein">—</strong></div>
    <div class="result">Nitrite:   <strong id="res-nitrite">—</strong></div>
    <div class="result">Leukocyte: <strong id="res-leukocyte">—</strong></div>
  </div>

  <script>
    // UI elements
    const takePicBtn  = document.getElementById('takePicBtn');
    const cameraInput = document.getElementById('cameraInput');

    takePicBtn.addEventListener('click', () => cameraInput.click());
    cameraInput.addEventListener('change', () => {
      const file = cameraInput.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d');
        canvas.width  = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        detectAndWarp();
      };
      img.src = URL.createObjectURL(file);
    });

    // Main processing: warp and analyze
    function detectAndWarp() {
      // Read canvas pixel data instead of cv.imread
      const canvasOut = document.getElementById('canvasOutput');
      const imgData = canvasOut.getContext('2d').getImageData(0, 0, canvasOut.width, canvasOut.height);
      let src = cv.matFromImageData(imgData);
      let gray = new cv.Mat();
      let thresh = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.threshold(gray, thresh, 60, 255, cv.THRESH_BINARY_INV);

      // Find contours
      let contours = new cv.MatVector();
      let hier = new cv.Mat();
      let squares = [];
      cv.findContours(thresh, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      for (let i = 0; i < contours.size(); i++) {
        let cnt = contours.get(i);
        let approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
        if (approx.rows === 4 && cv.contourArea(approx) > 1000) {
          let pts = [];
          for (let j = 0; j < 4; j++)
            pts.push({ x: approx.data32S[2*j], y: approx.data32S[2*j+1] });
          const cx = pts.reduce((s,p) => s + p.x, 0) / 4;
          const cy = pts.reduce((s,p) => s + p.y, 0) / 4;
          squares.push({ centroid: {x:cx, y:cy}, corners: pts });
        }
        approx.delete();
      }
      if (squares.length !== 4) {
        document.getElementById('loading').textContent = '❌ Failed to detect 4 corner markers.';
        [src, gray, thresh, contours, hier].forEach(m => m.delete());
        return;
      }

      // Order corners: top-left, top-right, bottom-right, bottom-left
      squares.sort((a, b) => a.centroid.y - b.centroid.y);
      const topRow = squares.slice(0,2).sort((a,b) => a.centroid.x - b.centroid.x);
      const botRow = squares.slice(2,4).sort((a,b) => a.centroid.x - b.centroid.x);
      const ptsArr = [ topRow[0].centroid, topRow[1].centroid, botRow[1].centroid, botRow[0].centroid ];

      // Warp to fixed size
      const WIDTH = 400, HEIGHT = 600;
      const warpedCanvas = document.getElementById('canvasWarped');
      warpedCanvas.width  = WIDTH;
      warpedCanvas.height = HEIGHT;
      const srcTri = cv.matFromArray(4,1,cv.CV_32FC2, ptsArr.flatMap(p=>[p.x,p.y]));
      const dstTri = cv.matFromArray(4,1,cv.CV_32FC2, [0,0, WIDTH,0, WIDTH,HEIGHT, 0,HEIGHT]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      const dst = new cv.Mat();
      cv.warpPerspective(src, dst, M, new cv.Size(WIDTH, HEIGHT));
      cv.imshow('canvasWarped', dst);

      // Cleanup
      [src, gray, thresh, contours, hier, srcTri, dstTri, M, dst].forEach(m => m.delete());

      // Analyze colors
      setTimeout(() => analyzePads(warpedCanvas), 100);
    }
        approx.delete();
      }
      if (squares.length !== 4) {
        document.getElementById('loading').textContent = '❌ Failed to detect 4 corner markers.';
        [src, gray, thresh, contours, hier].forEach(m => m.delete());
        return;
      }

      // Order corners: top-left, top-right, bottom-right, bottom-left
      squares.sort((a, b) => a.centroid.y - b.centroid.y);
      const topRow = squares.slice(0,2).sort((a,b) => a.centroid.x - b.centroid.x);
      const botRow = squares.slice(2,4).sort((a,b) => a.centroid.x - b.centroid.x);
      const ptsArr = [ topRow[0].centroid, topRow[1].centroid, botRow[1].centroid, botRow[0].centroid ];

      // Warp to fixed size
      const WIDTH = 400, HEIGHT = 600;
      const warpedCanvas = document.getElementById('canvasWarped');
      warpedCanvas.width  = WIDTH;
      warpedCanvas.height = HEIGHT;
      const srcTri = cv.matFromArray(4,1,cv.CV_32FC2, ptsArr.flatMap(p=>[p.x,p.y]));
      const dstTri = cv.matFromArray(4,1,cv.CV_32FC2, [0,0, WIDTH,0, WIDTH,HEIGHT, 0,HEIGHT]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      const dst = new cv.Mat();
      cv.warpPerspective(src, dst, M, new cv.Size(WIDTH, HEIGHT));
      cv.imshow('canvasWarped', dst);

      // Cleanup
      [src, gray, thresh, contours, hier, srcTri, dstTri, M, dst].forEach(m => m.delete());

      // Analyze colors
      setTimeout(() => analyzePads(warpedCanvas), 100);
    }

    // Color references
    const references = {
      glucose:   [ {hex:'#7dcff4',label:'Negative'}, {hex:'#67b492',label:'+/-100'}, {hex:'#6ba864',label:'+250'}, {hex:'#7c7d39',label:'++500'}, {hex:'#654224',label:'+++1000'} ],
      protein:   [ {hex:'#f4ee63',label:'Negative'}, {hex:'#e7e785',label:'Trace'},   {hex:'#dce480',label:'+30'},   {hex:'#b4cf80',label:'++100'},   {hex:'#a2ca95',label:'+++300'}, {hex:'#78b289',label:'++++1000'} ],
      nitrite:   [ {hex:'#fef6df',label:'Negative'}, {hex:'#fae3e9',label:'Trace'},   {hex:'#d75f9f',label:'Positive'} ],
      leukocyte: [ {hex:'#fef1de',label:'Negative'}, {hex:'#f9e2c8',label:'+25'},    {hex:'#f6dee4',label:'++75'},   {hex:'#c298bd',label:'++500'} ]
    };

    // Sample and interpret pad colors
    function analyzePads(cnv) {
      const ctx = cnv.getContext('2d');
      const W = cnv.width, H = cnv.height, R = 8;
      const positions = [0.414,0.468,0.522,0.575];
      ['glucose','protein','nitrite','leukocyte'].forEach((lab,i) => {
        const x = Math.round(W/2), y = Math.round(H * positions[i]);
        const data = ctx.getImageData(x-R, y-R, R*2, R*2).data;
        let r=0,g=0,b=0,count=0;
        for (let k=0; k<data.length; k+=4) {
          r+=data[k]; g+=data[k+1]; b+=data[k+2]; count++;
        }
        const avgR = Math.round(r/count), avgG = Math.round(g/count), avgB = Math.round(b/count);
        const hex = '#' + [avgR,avgG,avgB].map(v=>v.toString(16).padStart(2,'0')).join('');
        const res = interpretColor(hex, references[lab]);
        document.getElementById(`res-${lab}`).textContent = res;
      });
    }

    // Find nearest reference color
    function interpretColor(hex, ref) {
      const sr = parseInt(hex.slice(1,3),16), sg = parseInt(hex.slice(3,5),16), sb = parseInt(hex.slice(5,7),16);
      let best=Infinity, label='—';
      ref.forEach(r => {
        const rr=parseInt(r.hex.slice(1,3),16), rg=parseInt(r.hex.slice(3,5),16), rb=parseInt(r.hex.slice(5,7),16);
        const d = (sr-rr)**2 + (sg-rg)**2 + (sb-rb)**2;
        if (d<best) { best=d; label=r.label; }
      });
      return label;
    }
  </script>
</body>
</html>
