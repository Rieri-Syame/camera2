<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-Up - Test-Strip Analyzer</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #auth { width: 320px; padding: 2rem; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input { width: 100%; padding: .5em; margin: .5em 0; box-sizing: border-box; }
    button { width: 100%; padding: .7em; margin-top: 1em; }
    #msg { color: crimson; margin-top: .5em; font-size: .9em; }
  </style>
</head>
<body>
  <div id="auth">
    <h2>Sign Up</h2>
    <input id="name"    type="text"    placeholder="Full Name"        required>
    <input id="age"     type="number"  placeholder="Age"              required>
    <input id="email"   type="email"   placeholder="Email Address"    required>
    <input id="address" type="text"    placeholder="Home Address"     required>
    <input id="contact" type="tel"     placeholder="Contact Number"   required>
    <button id="signup">Sign Up & Continue</button>
    <div id="msg"></div>
  </div>

  <script>
    document.getElementById('signup').onclick = () => {
      const name    = document.getElementById('name').value.trim();
      const age     = document.getElementById('age').value.trim();
      const email   = document.getElementById('email').value.trim();
      const address = document.getElementById('address').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const msg     = document.getElementById('msg');
      if (!name || !age || !email || !address || !contact) {
        msg.textContent = 'Please fill in all fields.';
        return;
      }
      // Store user details in localStorage
      localStorage.setItem('demo_user', JSON.stringify({ name, age, email, address, contact }));
      // Redirect to analyzer page
      window.location.href = 'analyzer.html';
    };
  </script>
</body>
</html>
