<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Test-Strip Analyzer</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    #auth { width: 300px; padding: 2rem; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 0.5em; margin: 0.5em 0; box-sizing: border-box; }
    button { width: 48%; padding: 0.6em; margin-right: 2%; }
    #msg { color: crimson; margin-top: 0.5em; font-size: 0.9em; }
  </style>
</head>
<body>
  <div id="auth">
    <h2>Sign Up / Login</h2>
    <input id="email"    type="email"    placeholder="you@example.com" required>
    <input id="password" type="password" placeholder="Password" required>
    <div>
      <button id="signup">Sign Up</button>
      <button id="login">Login</button>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    const emailIn = document.getElementById('email');
    const passIn  = document.getElementById('password');
    const msg     = document.getElementById('msg');
    document.getElementById('signup').onclick = () => {
      const e = emailIn.value.trim(), p = passIn.value;
      if (!e||!p) return msg.textContent = 'Please fill both fields.';
      localStorage.setItem('demo_user', JSON.stringify({ email:e, pass:p }));
      msg.textContent = '✅ Signed up! Click Login.';
    };
    document.getElementById('login').onclick = () => {
      const stored = JSON.parse(localStorage.getItem('demo_user')||'{}');
      if (stored.email===emailIn.value.trim() && stored.pass===passIn.value) {
        window.location.href = 'analyzer.html';
      } else {
        msg.textContent = '❌ Invalid credentials.';
      }
    };
  </script>
</body>
</html>
