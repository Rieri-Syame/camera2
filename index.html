<script>
  // Once OpenCV is ready...
  function onOpenCvReady() {
    document.getElementById('loading').textContent = '✅ OpenCV.js loaded.';
    document.getElementById('takePicBtn').disabled = false;
  }
  var Module = { onRuntimeInitialized: onOpenCvReady };
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
  const takePicBtn  = document.getElementById('takePicBtn');
  const cameraInput = document.getElementById('cameraInput');
  const canvas      = document.getElementById('canvasOutput');
  const warped      = document.getElementById('canvasWarped');
  const loading     = document.getElementById('loading');
  const ctx         = canvas.getContext('2d');

  takePicBtn.addEventListener('click', () => cameraInput.click());

  cameraInput.addEventListener('change', () => {
    const file = cameraInput.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      canvas.width  = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      detectAndWarp();
    };
    img.src = URL.createObjectURL(file);
  });

  function detectAndWarp() {
    let src    = cv.imread(canvas);
    let gray   = new cv.Mat();
    let thresh = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.threshold(gray, thresh, 60, 255, cv.THRESH_BINARY_INV);

    let contours = new cv.MatVector(), hier = new cv.Mat();
    let squares = [];
    cv.findContours(thresh, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    for (let i = 0; i < contours.size(); i++) {
      let cnt    = contours.get(i);
      let approx = new cv.Mat();
      cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
      if (approx.rows === 4 && cv.contourArea(approx) > 1000) {
        let pts = [];
        for (let j = 0; j < 4; j++)
          pts.push({ x: approx.data32S[2*j], y: approx.data32S[2*j+1] });
        const cx = pts.reduce((s,p)=>s+p.x,0)/4;
        const cy = pts.reduce((s,p)=>s+p.y,0)/4;
        squares.push({ centroid:{x:cx,y:cy}, corners:pts });
      }
      approx.delete();
    }
    if (squares.length !== 4) {
      loading.textContent = '❌ Failed to detect 4 corner markers.';
      [src, gray, thresh, contours, hier].forEach(m=>m.delete());
      return;
    }

    // sort into TL,TR,BR,BL
    squares.sort((a,b)=>a.centroid.y - b.centroid.y);
    let top = squares.slice(0,2).sort((a,b)=>a.centroid.x - b.centroid.x);
    let bot = squares.slice(2,4).sort((a,b)=>a.centroid.x - b.centroid.x);
    const ptsArr = [
      top[0].centroid, top[1].centroid,
      bot[1].centroid, bot[0].centroid
    ];

    const dsize  = new cv.Size(400,600);
    const srcTri = cv.matFromArray(4,1,cv.CV_32FC2, ptsArr.flatMap(p=>[p.x,p.y]));
    const dstTri = cv.matFromArray(4,1,cv.CV_32FC2,[0,0,400,0,400,600,0,600]);
    const M      = cv.getPerspectiveTransform(srcTri, dstTri);
    const dst    = new cv.Mat();
    cv.warpPerspective(src, dst, M, dsize);

    // **THIS** line must use the ID string:
    cv.imshow('canvasWarped', dst);

    // clean up
    [src, gray, thresh, contours, hier, srcTri, dstTri, M].forEach(m=>m.delete());

    // wait a tick so the browser renders the warp, then sample it:
    setTimeout(() => analyzePads(warped), 50);
  }

  const references = {
    glucose:   [ {hex:'#7dcff4',label:'Negative'}, {hex:'#67b492',label:'+/-100'}, {hex:'#6ba864',label:'+250'}, {hex:'#7c7d39',label:'++500'}, {hex:'#654224',label:'+++1000'} ],
    protein:   [ {hex:'#f4ee63',label:'Negative'}, {hex:'#e7e785',label:'Trace'}, {hex:'#dce480',label:'+30'}, {hex:'#b4cf80',label:'++100'}, {hex:'#a2ca95',label:'+++300'}, {hex:'#78b289',label:'++++1000'} ],
    nitrite:   [ {hex:'#fef6df',label:'Negative'}, {hex:'#fae3e9',label:'Trace'}, {hex:'#d75f9f',label:'Positive'} ],
    leukocyte: [ {hex:'#fef1de',label:'Negative'}, {hex:'#f9e2c8',label:'+25'}, {hex:'#f6dee4',label:'++75'}, {hex:'#c298bd',label:'++500'} ]
  };

  function analyzePads(cnv) {
    console.log('🕵️‍♂️ Starting color analysis…');
    const ctxWarp = cnv.getContext('2d');
    const W       = cnv.width, H = cnv.height, R = 8;
    const positions = [0.414,0.468,0.522,0.575];
    const labs      = ['glucose','protein','nitrite','leukocyte'];

    labs.forEach((lab,i) => {
      const x = Math.round(W/2), y = Math.round(H * positions[i]);
      const data = ctxWarp.getImageData(x-R, y-R, R*2, R*2).data;
      let r=0,g=0,b=0,count=0;
      for (let k=0; k<data.length; k+=4) {
        r += data[k];
        g += data[k+1];
        b += data[k+2];
        count++;
      }
      const avgR = Math.round(r/count),
            avgG = Math.round(g/count),
            avgB = Math.round(b/count),
            hex = '#' + [avgR,avgG,avgB]
                    .map(v=>v.toString(16).padStart(2,'0'))
                    .join('');
      console.log(lab, '→ RGB:', avgR,avgG,avgB, 'hex:', hex);
      const result = interpretColor(hex, references[lab]);
      document.getElementById(`res-${lab}`).textContent = result;
    });
  }

  function interpretColor(hex, ref) {
    const sr = parseInt(hex.slice(1,3),16),
          sg = parseInt(hex.slice(3,5),16),
          sb = parseInt(hex.slice(5,7),16);
    let best = Infinity, label = '—';
    ref.forEach(r => {
      const rr = parseInt(r.hex.slice(1,3),16),
            rg = parseInt(r.hex.slice(3,5),16),
            rb = parseInt(r.hex.slice(5,7),16);
      const d = (sr-rr)**2 + (sg-rg)**2 + (sb-rb)**2;
      if (d < best) { best = d; label = r.label; }
    });
    return label;
  }
</script>
