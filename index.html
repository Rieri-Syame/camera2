<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strip Analyzer</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .tabs { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 10px; padding: 0; list-style: none; }
    .tabs li { padding: 10px 20px; cursor: pointer; }
    .tabs li.active { border-bottom: 3px solid #007bff; font-weight: bold; }
    .tab-content > div { display: none; }
    .tab-content > div.active { display: block; }
    #canvasContainer { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
    video, canvas { border: 1px solid #ccc; max-width: 45vw; height: auto; }
    #loading { margin-bottom: 10px; }
    #output { margin-top: 20px; font-size: 1rem; }
    .result { margin: 4px 0; }
    #captureBtn { margin-top: 10px; padding: 8px 12px; font-size: 1rem; cursor: pointer; }
  </style>
  <script>
    // Choose the main (wide) rear camera instead of ultra-wide
    async function startPreferredCamera() {
      // 1) Request any video to get labels
      const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
      tempStream.getTracks().forEach(t => t.stop());
      // 2) Enumerate devices
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      // 3) Pick by label
      let preferred = cams.find(d => /back|rear/i.test(d.label) && /wide/i.test(d.label));
      if (!preferred) {
        preferred = cams.find(d => /back|rear/i.test(d.label)) || cams[0];
      }
      // 4) Open that camera
      const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: preferred.deviceId } } });
      video.srcObject = stream;
      loading.textContent = 'Camera active.';
    }

    function onOpenCvReady() {
      loading.textContent = 'OpenCV.js loaded.';
      captureBtn.disabled = false;
      startPreferredCamera().catch(err => {
        console.error('Camera error:', err);
        loading.textContent = '❌ Cannot access camera.';
      });
    }
    // Hook into OpenCV runtime
    var Module = { onRuntimeInitialized: onOpenCvReady };
  </script>
  <!-- Single-file build with inlined WASM -->
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body>
  <h2>Test-Strip Analyzer</h2>
  <ul class="tabs">
    <li data-tab="analyze" class="active">Analyze</li>
    <li data-tab="saved">Saved</li>
  </ul>
  <div class="tab-content">
    <div id="analyze" class="active">
      <p>Point your camera at the card with 4 black corner markers and hit Capture.</p>
      <div id="loading">Loading OpenCV.js…</div>
      <video id="video" autoplay muted playsinline width="400" height="600"></video>
      <button id="captureBtn" disabled>Capture Frame</button>
      <div id="canvasContainer">
        <canvas id="canvasOutput"></canvas>
        <canvas id="canvasWarped"></canvas>
      </div>
      <div id="output">
        <div class="result">Glucose: <span id="res-glucose">—</span></div>
        <div class="result">Protein: <span id="res-protein">—</span></div>
        <div class="result">Nitrite: <span id="res-nitrite">—</span></div>
        <div class="result">Leukocyte: <span id="res-leukocyte">—</span></div>
      </div>
    </div>
    <div id="saved">
      <h3>Last Analyzed Image</h3>
      <div id="saved-image-container">No image saved yet.</div>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tabs li').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tabs li').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const tgt = tab.dataset.tab;
        document.querySelectorAll('.tab-content > div').forEach(div => {
          div.classList.toggle('active', div.id === tgt);
        });
      });
    });

    // References to elements
    const loading = document.getElementById('loading');
    const video = document.getElementById('video');
    const captureBtn = document.getElementById('captureBtn');
    const canvas = document.getElementById('canvasOutput');
    const warped = document.getElementById('canvasWarped');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Capture frame and process
    captureBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      detectAndWarp();
    });

    // Perspective warp and analyze
    function detectAndWarp() {
      let src = cv.imread(canvas);
      let gray = new cv.Mat();
      let thresh = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.threshold(gray, thresh, 60, 255, cv.THRESH_BINARY_INV);

      let contours = new cv.MatVector();
      let hier = new cv.Mat();
      let squares = [];
      cv.findContours(thresh, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      for (let i = 0; i < contours.size(); i++) {
        let cnt = contours.get(i);
        let approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
        if (approx.rows === 4 && cv.contourArea(approx) > 1000) {
          let pts = [];
          for (let j = 0; j < 4; j++) {
            pts.push({ x: approx.data32S[2*j], y: approx.data32S[2*j+1] });
          }
          const cx = pts.reduce((s, p) => s + p.x, 0) / 4;
          const cy = pts.reduce((s, p) => s + p.y, 0) / 4;
          squares.push({ centroid: { x: cx, y: cy }, corners: pts });
        }
        approx.delete();
      }

      if (squares.length !== 4) {
        loading.textContent = 'Failed to detect 4 corner markers.';
        [src, gray, thresh, contours, hier].forEach(m => m.delete());
        return;
      }

      squares.sort((a, b) => a.centroid.y - b.centroid.y);
      const top = squares.slice(0, 2).sort((a, b) => a.centroid.x - b.centroid.x);
      const bot = squares.slice(2, 4).sort((a, b) => a.centroid.x - b.centroid.x);
      const pts = [top[0].centroid, top[1].centroid, bot[1].centroid, bot[0].centroid];

      const dsize = new cv.Size(400, 600);
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, pts.flatMap(p => [p.x, p.y]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, 400, 0, 400, 600, 0, 600]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      const dst = new cv.Mat();
      cv.warpPerspective(src, dst, M, dsize);
      warped.width = 400;
      warped.height = 600;
      cv.imshow(warped, dst);

      [src, gray, thresh, contours, hier, srcTri, dstTri, M, dst].forEach(m => m.delete());
      analyzePads(warped);
      saveLastImage();
    }

    // Reference palettes
    const references = {
      glucose:   [{hex:'#7dcff4',label:'Negative'},{hex:'#67b492',label:'+/-100'},{hex:'#6ba864',label:'+250'},{hex:'#7c7d39',label:'++500'},{hex:'#654224',label:'+++1000'}],
      protein:   [{hex:'#f4ee63',label:'Negative'},{hex:'#e7e785',label:'Trace'},{hex:'#dce480',label:'+30'},{hex:'#b4cf80',label:'++100'},{hex:'#a2ca95',label:'+++300'},{hex:'#78b289',label:'++++1000'}],
      nitrite:   [{hex:'#fef6df',label:'Negative'},{hex:'#fae3e9',label:'Trace'},{hex:'#d75f9f',label:'Positive'}],
      leukocyte: [{hex:'#fef1de',label:'Negative'},{hex:'#f9e2c8',label:'+25'},{hex:'#f6dee4',label:'++75'},{hex:'#c298bd',label:'++500'}]
    };

    function analyzePads(cnv) {
      const c = cnv.getContext('2d', { willReadFrequently: true });
      const W = cnv.width;
      const H = cnv.height;
      const R = 8;
      const pos = [0.414, 0.468, 0.522, 0.575];
      const labs = ['glucose','protein','nitrite','leukocyte'];
      labs.forEach((lab, i) => {
        const x = W/2;
        const y = Math.round(H * pos[i]);
        c.fillStyle = 'white'; c.beginPath(); c.arc(x, y, R, 0, 2*Math.PI); c.fill();
        c.strokeStyle = 'black'; c.lineWidth = 2; c.stroke();
        const data = c.getImageData(x-R, y-R, R*2, R*2).data;
        let [r, g, b, n] = [0, 0, 0, 0];
        for (let k = 0; k < data.length; k += 4) { r += data[k]; g += data[k+1]; b += data[k+2]; n++; }
        const hex = '#'+[r/n, g/n, b/n].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
        const res = interpretColor(hex, references[lab]);
        c.fillStyle = 'black'; c.font = '14px sans-serif';
        c.fillText(lab.charAt(0).toUpperCase()+lab.slice(1)+': '+res, 5, y+5);
        document.getElementById(`res-${lab}`).textContent = res;
      });
    }

    function interpretColor(hex, ref) {
      const sr = parseInt(hex.slice(1,3),16);
      const sg = parseInt(hex.slice(3,5),16);
      const sb = parseInt(hex.slice(5,7),16);
      let best = Infinity, label = '';
      ref.forEach(r => {
        const rr = parseInt(r.hex.slice(1,3),16);
        const rg = parseInt(r.hex.slice(3,5),16);
        const rb = parseInt(r.hex.slice(5,7),16);
        const d = (sr-rr)**2 + (sg-rg)**2 + (sb-rb)**2;
        if (d < best) { best = d; label = r.label; }
      });
      return label;
    }

    function saveLastImage() {
      const dataURL = warped.toDataURL('image/png');
      document.getElementById('saved-image-container').innerHTML = `<img src="${dataURL}">`;
      localStorage.setItem('lastAnalyzedImage', dataURL);
    }

    // Load last image
    document.addEventListener('DOMContentLoaded', () => {
      const d = localStorage.getItem('lastAnalyzedImage');
      if (d) document.getElementById('saved-image-container').innerHTML = `<img src="${d}">`;
    });
  </script>
</body>
</html>
