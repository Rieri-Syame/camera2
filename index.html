<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camera + Test-Strip Analyzer</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #loading { margin-bottom: 1rem; font-size: 1.1rem; }
    #takePicBtn { padding: .8rem 1.2rem; font-size: 1rem; }
    #canvasContainer { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
    canvas { border: 1px solid #ccc; max-width: 45vw; height: auto; }
    #output { margin-top: 1.5rem; }
    .result { margin: .4rem 0; }
  </style>

  <!-- 1) Must define Module before OpenCV.js loads -->
  <script>
    var Module = {
      onRuntimeInitialized() {
        document.getElementById('loading').textContent = '✅ OpenCV.js loaded.';
        document.getElementById('takePicBtn').disabled = false;
      }
    };
  </script>

  <!-- 2) Load OpenCV.js -->
  <script src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>

<body>
  <h1>Camera + Test-Strip Analyzer</h1>
  <div id="loading">Loading OpenCV.js…</div>
  <button id="takePicBtn" disabled>Take Picture</button>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />

  <div id="canvasContainer">
    <canvas id="canvasOutput"></canvas>
    <canvas id="canvasWarped" width="400" height="600"></canvas>
  </div>

  <div id="output">
    <div class="result">Glucose:   <strong id="res-glucose">—</strong></div>
    <div class="result">Protein:   <strong id="res-protein">—</strong></div>
    <div class="result">Nitrite:   <strong id="res-nitrite">—</strong></div>
    <div class="result">Leukocyte: <strong id="res-leukocyte">—</strong></div>
  </div>

  <script>
    const takePicBtn  = document.getElementById('takePicBtn');
    const cameraInput = document.getElementById('cameraInput');
    const refs = {
      glucose:   [ {hex:'#7dcff4',label:'Negative'}, {hex:'#67b492',label:'+/-100'}, {hex:'#6ba864',label:'+250'}, {hex:'#7c7d39',label:'++500'}, {hex:'#654224',label:'+++1000'} ],
      protein:   [ {hex:'#f4ee63',label:'Negative'}, {hex:'#e7e785',label:'Trace'}, {hex:'#dce480',label:'+30'}, {hex:'#b4cf80',label:'++100'}, {hex:'#a2ca95',label:'+++300'}, {hex:'#78b289',label:'++++1000'} ],
      nitrite:   [ {hex:'#fef6df',label:'Negative'}, {hex:'#fae3e9',label:'Trace'}, {hex:'#d75f9f',label:'Positive'} ],
      leukocyte: [ {hex:'#fef1de',label:'Negative'}, {hex:'#f9e2c8',label:'+25'}, {hex:'#f6dee4',label:'++75'}, {hex:'#c298bd',label:'++500'} ]
    };

    takePicBtn.addEventListener('click', () => cameraInput.click());
    cameraInput.addEventListener('change', () => {
      const file = cameraInput.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        let c = document.getElementById('canvasOutput');
        c.width = img.width; c.height = img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        detectAndWarp();
      };
      img.src = URL.createObjectURL(file);
    });

    function detectAndWarp() {
      const out = document.getElementById('canvasOutput');
      const imgData = out.getContext('2d').getImageData(0, 0, out.width, out.height);
      let src = cv.matFromImageData(imgData);
      let gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

      // 1) Blur + 2) Adaptive Threshold + 3) Morphology
      cv.GaussianBlur(gray, gray, new cv.Size(5,5), 0);
      let thresh = new cv.Mat();
      cv.adaptiveThreshold(
        gray, thresh, 255,
        cv.ADAPTIVE_THRESH_GAUSSIAN_C,
        cv.THRESH_BINARY_INV, 11, 2
      );
      let M = cv.Mat.ones(3,3, cv.CV_8U);
      cv.morphologyEx(thresh, thresh, cv.MORPH_OPEN, M);

      // 4) Find & filter quads
      let contours = new cv.MatVector(), hier = new cv.Mat();
      cv.findContours(thresh, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      let squares = [];
      for (let i = 0; i < contours.size(); i++) {
        let cnt = contours.get(i), approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
        if (approx.rows === 4 && cv.contourArea(approx) > 400) {
          let pts = [];
          for (let j = 0; j < 4; j++) {
            pts.push({ x: approx.data32S[2*j], y: approx.data32S[2*j+1] });
          }
          let cx = pts.reduce((s,p)=>s+p.x,0)/4, cy = pts.reduce((s,p)=>s+p.y,0)/4;
          squares.push({ centroid:{x:cx,y:cy}, corners: pts });
        }
        approx.delete();
      }
      console.log("detected corner squares:", squares.length, squares);
      if (squares.length !== 4) {
        document.getElementById('loading').textContent = '❌ Failed to detect 4 corner markers.';
        [src, gray, thresh, contours, hier, M].forEach(m=>m.delete());
        return;
      }

      // 5) Order & Warp
      squares.sort((a,b)=>a.centroid.y - b.centroid.y);
      const top = squares.slice(0,2).sort((a,b)=>a.centroid.x - b.centroid.x);
      const bot = squares.slice(2,4).sort((a,b)=>a.centroid.x - b.centroid.x);
      const pts = [ top[0].centroid, top[1].centroid, bot[1].centroid, bot[0].centroid ]
                    .flatMap(p=>[p.x,p.y]);
      const W=400, H=600;
      let srcTri = cv.matFromArray(4,1,cv.CV_32FC2, pts);
      let dstTri = cv.matFromArray(4,1,cv.CV_32FC2, [0,0,W,0,W,H,0,H]);
      let perspM = cv.getPerspectiveTransform(srcTri, dstTri);
      let dst = new cv.Mat();
      cv.warpPerspective(src, dst, perspM, new cv.Size(W,H));
      cv.imshow('canvasWarped', dst);

      [src, gray, thresh, contours, hier, M, srcTri, dstTri, perspM, dst].forEach(m=>m.delete());
      setTimeout(()=> analyzePads(), 100);
    }

    function analyzePads() {
      const cnv = document.getElementById('canvasWarped'), ctx = cnv.getContext('2d');
      const W = cnv.width, H = cnv.height, R = 8, pos = [0.414,0.468,0.522,0.575];
      ['glucose','protein','nitrite','leukocyte'].forEach((lab,i)=>{
        let x = Math.round(W/2), y = Math.round(H * pos[i]);
        let data = ctx.getImageData(x-R, y-R, 2*R, 2*R).data;
        let [r,g,b,cnt] = [0,0,0,0];
        for (let k=0; k<data.length; k+=4) {
          r+=data[k]; g+=data[k+1]; b+=data[k+2]; cnt++;
        }
        let hex = '#'+[r/cnt,g/cnt,b/cnt].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
        document.getElementById(`res-${lab}`).textContent = interpretColor(hex, refs[lab]);
      });
    }

    function interpretColor(hex, arr) {
      let sr = parseInt(hex.slice(1,3),16),
          sg = parseInt(hex.slice(3,5),16),
          sb = parseInt(hex.slice(5,7),16);
      let best = Infinity, label = '—';
      arr.forEach(c=>{
        let rr = parseInt(c.hex.slice(1,3),16),
            rg = parseInt(c.hex.slice(3,5),16),
            rb = parseInt(c.hex.slice(5,7),16);
        let d = (sr-rr)**2 + (sg-rg)**2 + (sb-rb)**2;
        if (d < best) { best = d; label = c.label; }
      });
      return label;
    }
  </script>
</body>
</html>
