<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Patient Profile – Test-Strip Analyzer</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; max-width: 600px; margin: auto; background: #f5f5f5; }
    h2 { text-align: center; }
    .section { background: #fff; padding: 1rem; margin-bottom: 1rem; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    label { display: block; margin: .5em 0 0.2em; }
    input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; padding: .5em; box-sizing: border-box; border:1px solid #ccc; border-radius:4px; }
    .checkbox-group, .checkbox-group label { display: inline-block; margin-right: 1em; }
    button { width: 100%; padding: .8em; margin-top: 1em; background: #007bff; color: #fff; border:none; border-radius:4px; cursor:pointer; }
    button:hover { background: #0056b3; }
    #msg { color: crimson; text-align: center; margin-top: .5em; }
  </style>
</head>
<body>
  <h2>Patient Profile</h2>
  <form id="profileForm">
    <div class="section">
      <label for="bhc">Preferred Barangay Health Center</label>
      <input id="bhc" type="text" required />
      <label for="hospital">Preferred Hospital</label>
      <input id="hospital" type="text" required />
    </div>
    <div class="section">
      <label>Physical Information</label>
      <label for="height">Height (cm)</label>
      <input id="height" type="number" step="0.1" required />
      <label for="weight">Weight (kg)</label>
      <input id="weight" type="number" step="0.1" required />
    </div>
    <div class="section">
      <label>Lifestyle Habits</label>
      <div class="checkbox-group">
        <label><input name="smoker" type="radio" value="Yes" required /> Smoker</label>
        <label><input name="smoker" type="radio" value="No" /> Non-Smoker</label>
      </div>
      <div class="checkbox-group">
        <label><input name="alcohol" type="radio" value="Yes" required /> Alcohol intake</label>
        <label><input name="alcohol" type="radio" value="No" /> None</label>
      </div>
    </div>
    <div class="section">
      <label>Current Medications</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="meds" value="Iron supplements" /> Iron supplements</label>
        <label><input type="checkbox" name="meds" value="Folic acid" /> Folic acid</label>
        <label><input type="checkbox" name="meds" value="Multivitamins" /> Multivitamins</label>
        <label><input type="checkbox" name="meds" value="Calcium supplements" /> Calcium supplements</label>
        <label><input type="checkbox" name="meds" value="Antihypertensives" /> Antihypertensives</label>
        <label><input type="checkbox" name="meds" value="Insulin" /> Insulin</label>
        <label><input type="checkbox" name="meds" value="Antibiotics" /> Antibiotics</label>
        <label><input type="checkbox" name="meds" value="Antacids" /> Antacids</label>
        <label>Others: <input id="meds_other" type="text" placeholder="Specify" /></label>
      </div>
    </div>
    <div class="section">
      <label for="lmp">Last Menstrual Period (LMP)</label>
      <input id="lmp" type="date" required />
      <p>Automatically calculates AOG & EDD on submission.</p>
    </div>
    <div class="section">
      <label>Pregnancy History (GTPAL)</label>
      <input id="gtpal" type="text" placeholder="e.g. G2T1P0A1L1" required />
    </div>
    <div class="section">
      <label>Health Conditions</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="conds" value="Hypertension" /> Hypertension</label>
        <label><input type="checkbox" name="conds" value="GDM" /> GDM</label>
        <label><input type="checkbox" name="conds" value="UTI" /> UTI</label>
        <label><input type="checkbox" name="conds" value="Anemia" /> Anemia</label>
        <label><input type="checkbox" name="conds" value="Asthma" /> Asthma</label>
        <label><input type="checkbox" name="conds" value="Thyroid disorders" /> Thyroid disorders</label>
        <label><input type="checkbox" name="conds" value="Heart disease" /> Heart disease</label>
        <label><input type="checkbox" name="conds" value="Epilepsy" /> Epilepsy</label>
        <label><input type="checkbox" name="conds" value="HIV" /> HIV</label>
        <label><input type="checkbox" name="conds" value="Tuberculosis" /> Tuberculosis</label>
        <label>Others: <input id="conds_other" type="text" placeholder="Specify" /></label>
      </div>
    </div>
    <div class="section">
      <label>Allergies</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="alls" value="Food" /> Food</label>
        <label><input type="checkbox" name="alls" value="Medication" /> Medication</label>
        <label><input type="checkbox" name="alls" value="Environmental" /> Environmental</label>
        <label><input type="checkbox" name="alls" value="Latex" /> Latex</label>
        <label>Others: <input id="alls_other" type="text" placeholder="Specify" /></label>
      </div>
    </div>
    <div class="section">
      <label>Pregnancy Immunization</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="immu" value="TT" /> Tetanus Toxoid</label>
        <label><input type="checkbox" name="immu" value="Influenza" /> Influenza</label>
        <label><input type="checkbox" name="immu" value="COVID-19" /> COVID-19</label>
        <label><input type="checkbox" name="immu" value="Hepatitis B" /> Hepatitis B</label>
        <label><input type="checkbox" name="immu" value="Tdap" /> Pertussis (Tdap)</label>
        <label><input type="checkbox" name="immu" value="MMR" /> MMR</label>
        <label>Others: <input id="immu_other" type="text" placeholder="Specify" /></label>
      </div>
    </div>
    <div class="section">
      <label>Consent</label>
      <div><label><input type="checkbox" id="consent1" required /> I agree to collection/use of my personal data.</label></div>
      <div><label><input type="checkbox" id="consent2" required /> I agree to receive reminders for prenatal care.</label></div>
      <div><label><input type="checkbox" id="consent3" required /> I acknowledge Privacy Policy & Terms.</label></div>
      <div><label><input type="checkbox" id="consent4" /> I consent to anonymous data use for research.</label></div>
      <div><label><input type="checkbox" id="consent5" required /> I understand regular check-ups are required for hospital delivery.</label></div>
    </div>
    <button type="button" id="saveProfile">Save Profile & Continue</button>
    <div id="msg"></div>
  </form>

  <script>
    document.getElementById('saveProfile').onclick = () => {
      const msg = document.getElementById('msg');
      // gather fields
      const user = JSON.parse(localStorage.getItem('demo_user') || '{}');
      if (!user.email) {
        window.location.href = 'index.html';
        return;
      }
      const form = document.getElementById('profileForm');
      if (!form.checkValidity()) {
        msg.textContent = 'Please complete all required fields and consents.';
        return;
      }
      // collect values
      const profile = {
        bhc: document.getElementById('bhc').value.trim(),
        hospital: document.getElementById('hospital').value.trim(),
        height: document.getElementById('height').value,
        weight: document.getElementById('weight').value,
        smoker: document.querySelector('[name=smoker]:checked').value,
        alcohol: document.querySelector('[name=alcohol]:checked').value,
        meds: Array.from(document.querySelectorAll('[name=meds]:checked')).map(i=>i.value),
        meds_other: document.getElementById('meds_other').value.trim(),
        lmp: document.getElementById('lmp').value,
        gtpal: document.getElementById('gtpal').value.trim(),
        conds: Array.from(document.querySelectorAll('[name=conds]:checked')).map(i=>i.value),
        conds_other: document.getElementById('conds_other').value.trim(),
        alls: Array.from(document.querySelectorAll('[name=alls]:checked')).map(i=>i.value),
        alls_other: document.getElementById('alls_other').value.trim(),
        immu: Array.from(document.querySelectorAll('[name=immu]:checked')).map(i=>i.value),
        immu_other: document.getElementById('immu_other').value.trim(),
        consents: [
          document.getElementById('consent1').checked,
          document.getElementById('consent2').checked,
          document.getElementById('consent3').checked,
          document.getElementById('consent4').checked,
          document.getElementById('consent5').checked
        ]
      };
      // calculate AOG & EDD
      const lmpDate = new Date(profile.lmp);
      const today = new Date();
      const diffDays = Math.floor((today - lmpDate)/(1000*60*60*24));
      const aog = Math.floor(diffDays/7) + ' weeks';
      const edd = new Date(lmpDate.getTime() + 280*24*60*60*1000).toISOString().split('T')[0];
      profile.aog = aog; profile.edd = edd;
      localStorage.setItem('demo_profile', JSON.stringify(profile));
      window.location.href = 'analyzer.html';
    };
  </script>
</body>
</html>
